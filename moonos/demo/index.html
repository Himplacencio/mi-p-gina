<title>MoonOS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-screen Plasma-style desktop — wallpaper canvas, floating windows, bottom panel. Single dark look by design (night sky). */
:root {
  --night: #0e0c24;
  --panel: rgba(18, 16, 40, 0.88);
  --surface: #1b1838;
  --surface-2: #252150;
  --surface-3: #2f2a62;
  --line: #3a3570;
  --text: #ece8ff;
  --muted: #a7a2cf;
  --accent: #a996ff;
  --accent-strong: #8a72ff;
  --on-accent: #120f2e;
  --good: #6ee7a8;
  --warn: #ffcf6e;
  --bad: #ff8094;
  --term-bg: #0a091c;
  --font-ui: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --panel-h: 48px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#screen { position: relative; height: 100%; overflow: hidden; }
#wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Desktop icons ---------- */
#desktop-icons {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px));
  display: grid; grid-auto-flow: row; gap: 6px; z-index: 1;
}
.dicon {
  width: 92px; padding: 8px 4px; border: 1px solid transparent; border-radius: 8px;
  background: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; font-size: 12.5px; line-height: 1.25; color: var(--text);
  text-shadow: 0 1px 3px rgba(0,0,0,.9);
}
.dicon:hover { background: rgba(169,150,255,.16); border-color: rgba(169,150,255,.35); }
.dicon svg { width: 48px; height: 48px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }

/* ---------- Windows ---------- */
#windows { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--panel-h) + env(safe-area-inset-bottom, 0px)); z-index: 2; pointer-events: none; }
.win {
  position: absolute; pointer-events: auto;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.3);
  overflow: hidden; min-width: 300px; min-height: 200px;
  animation: win-in .16s ease-out;
}
.win.inactive .titlebar { color: var(--muted); }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.win.min { display: none; }
@keyframes win-in { from { transform: scale(.97); opacity: .4; } }
.titlebar {
  height: 38px; flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 6px 0 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
  cursor: default; touch-action: none;
}
.titlebar svg.ticon { width: 18px; height: 18px; flex: none; }
.titlebar .ttl { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbtn {
  width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: var(--muted);
  display: grid; place-items: center;
}
.wbtn:hover { background: var(--surface-3); color: var(--text); }
.wbtn.close:hover { background: var(--bad); color: #2a0610; }
.wbtn svg { width: 14px; height: 14px; }
.wbody { flex: 1; min-height: 0; overflow: auto; position: relative; user-select: text; -webkit-user-select: text; }

/* ---------- Panel ---------- */
#panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  height: calc(var(--panel-h) + env(safe-area-inset-bottom, 0px));
  padding: 0 max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px));
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(169,150,255,.18);
  display: flex; align-items: center; gap: 4px;
}
.pbtn {
  height: 40px; min-width: 40px; border: 0; border-radius: 8px; background: none;
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; color: var(--text);
}
.pbtn:hover { background: rgba(169,150,255,.14); }
.pbtn.on { background: rgba(169,150,255,.2); box-shadow: inset 0 -2px 0 var(--accent); }
.pbtn svg { width: 26px; height: 26px; flex: none; }
#launcher-btn svg { width: 30px; height: 30px; }
#tasks { flex: 1; min-width: 0; display: flex; gap: 4px; overflow: hidden; }
#tasks .pbtn { max-width: 190px; justify-content: flex-start; }
#tasks .pbtn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
#tray { display: flex; align-items: center; gap: 2px; color: var(--muted); }
#tray svg { width: 18px; height: 18px; }
#tray .pbtn { min-width: 34px; padding: 0 6px; color: var(--muted); }
#clock { display: flex; flex-direction: column; align-items: center; line-height: 1.15; padding: 0 8px; font-variant-numeric: tabular-nums; }
#clock b { font-size: 14px; font-weight: 600; color: var(--text); }
#clock small { font-size: 11px; color: var(--muted); }

/* ---------- Launcher ---------- */
#launcher {
  position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); bottom: calc(var(--panel-h) + env(safe-area-inset-bottom, 0px) + 6px);
  width: min(380px, calc(100% - 12px)); max-height: min(560px, calc(100% - var(--panel-h) - 24px));
  z-index: 6; display: flex; flex-direction: column;
  background: rgba(24, 21, 52, .97); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden;
}
.lhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 700; color: var(--accent); flex: none; }
.lhead b { display: block; }
.lhead small { color: var(--muted); }
#lsearch { margin: 12px 16px 4px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
#lapps { overflow: auto; padding: 6px 8px; display: grid; gap: 2px; }
.lapp { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.lapp:hover, .lapp:focus-visible { background: var(--surface-3); }
.lapp svg { width: 32px; height: 32px; flex: none; }
.lapp b { display: block; font-weight: 500; }
.lapp small { color: var(--muted); font-size: 12px; }
.lfoot { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
.lfoot button { display: flex; align-items: center; gap: 6px; border: 0; background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
.lfoot button:hover { background: var(--surface-3); }
.lfoot svg { width: 16px; height: 16px; }

/* ---------- Toasts ---------- */
#toasts { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(var(--panel-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 7; display: grid; gap: 8px; width: min(340px, calc(100% - 20px)); }
.toast { display: flex; gap: 12px; padding: 12px 14px; background: rgba(27,24,56,.97); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toast-in .25s ease-out; }
.toast svg { width: 32px; height: 32px; flex: none; }
.toast b { display: block; margin-bottom: 2px; }
.toast p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Boot / login / off overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
#grub { background: #000; color: #d9d6f2; font-family: var(--font-mono); flex-direction: column; gap: 18px; }
#grub h1 { font-size: 15px; font-weight: 400; margin: 0; color: var(--muted); }
#grub ul { list-style: none; margin: 0; padding: 6px; border: 1px solid #555; width: min(560px, 100%); }
#grub li { padding: 5px 10px; cursor: pointer; font-size: 14px; }
#grub li.sel { background: #d9d6f2; color: #000; }
#grub p { font-size: 13px; margin: 0; color: #8f8ab5; text-align: center; max-width: 560px; }
#splash { background: radial-gradient(circle at 50% 42%, #231d55 0%, var(--night) 60%); flex-direction: column; gap: 22px; }
#splash svg { width: 120px; height: 120px; animation: glow 2s ease-in-out infinite; }
#splash .word { font-size: 28px; font-weight: 600; letter-spacing: .04em; }
#splash .word span { color: var(--accent); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(169,150,255,.25); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 50% { filter: drop-shadow(0 0 18px rgba(169,150,255,.6)); } }
#login { flex-direction: column; gap: 14px; background: rgba(8,7,22,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#login .big-avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 38px; font-weight: 700; color: var(--accent); border: 2px solid var(--accent); }
#login h2 { margin: 0; font-size: 22px; font-weight: 600; }
#login form { display: flex; gap: 8px; width: min(320px, 100%); }
#login input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(27,24,56,.9); }
#login button { border: 0; border-radius: 8px; padding: 0 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
#login .hint { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
#login .err { color: var(--bad); font-size: 13px; margin: 0; min-height: 1.3em; }
#off { background: #000; flex-direction: column; gap: 14px; color: #77739a; }
#off button { border: 1px solid #333; background: #111; border-radius: 50%; width: 64px; height: 64px; display: grid; place-items: center; color: var(--accent); }
#off svg { width: 28px; height: 28px; }

/* ---------- Shared app UI ---------- */
.pad { padding: 18px 20px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #bbabff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-3); color: var(--muted); }
.chip.good { background: rgba(110,231,168,.14); color: var(--good); }
.chip.bad { background: rgba(255,128,148,.12); color: var(--bad); }
.chip.warn { background: rgba(255,207,110,.14); color: var(--warn); }
h2.app-h { margin: 0 0 4px; font-size: 20px; font-weight: 600; text-wrap: balance; }

/* Terminal */
.term { background: var(--term-bg); font-family: var(--font-mono); font-size: 13px; line-height: 1.5; padding: 10px 12px; min-height: 100%; cursor: text; }
.term pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.term .line { display: flex; gap: 0; }
.term input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--text); padding: 0; caret-color: var(--accent); }
.c-acc { color: var(--accent); } .c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-mut { color: var(--muted); } .c-b { font-weight: 600; }

/* Installer */
.inst { display: grid; grid-template-columns: 190px 1fr; height: 100%; }
.inst-side { background: #14122b; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.inst-side .logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 14px; font-weight: 700; font-size: 16px; }
.inst-side .logo svg { width: 34px; height: 34px; }
.step { padding: 8px 12px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.step.cur { background: var(--surface-3); color: var(--accent); font-weight: 600; }
.step.done { color: var(--text); }
.inst-main { display: flex; flex-direction: column; min-width: 0; }
.inst-content { flex: 1; overflow: auto; padding: 22px 24px; display: grid; align-content: start; gap: 16px; }
.inst-nav { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.checks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; gap: 10px; align-items: center; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border-color: var(--accent); background: rgba(169,150,255,.08); }
.opt input { margin-top: 3px; accent-color: var(--accent); }
.opt b { display: block; font-weight: 600; }
.opt small { color: var(--muted); }
.diskbar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.diskbar div { display: grid; place-items: center; white-space: nowrap; overflow: hidden; color: var(--on-accent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.summary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.summary dt { color: var(--muted); }
.summary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.progress { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-strong), var(--accent)); transition: width .3s; }
.slide { padding: 22px; border-radius: 12px; background: #14122b; border: 1px solid var(--line); min-height: 120px; display: grid; align-content: center; gap: 6px; }
.slide b { font-size: 18px; }
.joblog { font-family: var(--font-mono); font-size: 12px; color: var(--muted); max-height: 140px; overflow: auto; margin: 0; white-space: pre-wrap; }

/* Drivers */
.gpus { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.gpu { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 4px; }
.gpu.sel { border-color: var(--accent); background: rgba(169,150,255,.1); }
.gpu b { font-weight: 600; }
.gpu small { color: var(--muted); }
.pkgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pkgs ul { margin: 6px 0 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 12.5px; display: grid; gap: 3px; }
.pkgs .rm li { color: var(--muted); text-decoration: line-through; }
.pkgs .kp li { color: var(--good); }

/* Games */
.games-top { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 99px; background: var(--surface-3); position: relative; transition: background .2s; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.toggle input:checked { background: var(--accent-strong); }
.toggle input:checked::after { transform: translateX(14px); background: #fff; }
.glib { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 18px; }
.gcard { border: 0; padding: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; text-align: left; display: flex; flex-direction: column; }
.gcard img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.gcard .gi { padding: 10px 12px; display: grid; gap: 4px; }
.gcard b { font-weight: 600; }
.gcard:hover { outline: 2px solid var(--accent); }
.gamewrap { position: absolute; inset: 0; background: #000; touch-action: none; }
.gamewrap canvas { width: 100%; height: 100%; display: block; }

/* Files */
.files { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
.places { background: #17153a; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
.places button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.places button.sel, .places button:hover { background: var(--surface-3); color: var(--text); }
.fgrid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; align-content: start; }
.fitem { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12.5px; padding: 8px 4px; border-radius: 8px; overflow-wrap: anywhere; }
.fitem:hover { background: var(--surface-2); }
.fitem svg { width: 44px; height: 44px; }

/* About */
.about { display: grid; justify-items: center; gap: 14px; padding: 26px 22px; text-align: center; }
.about svg { width: 96px; height: 96px; }
.about table { border-collapse: collapse; text-align: left; width: min(420px, 100%); font-size: 13.5px; }
.about td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.about td:first-child { color: var(--muted); white-space: nowrap; }

/* ---------- Phone width ---------- */
@media (max-width: 700px) {
  .win { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; min-width: 0; border: 0; }
  #desktop-icons { grid-template-columns: repeat(3, 1fr); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
  .dicon { width: auto; }
  #tasks .pbtn span { display: none; }
  #tasks .pbtn { min-width: 40px; }
  #clock small { display: none; }
  .inst { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .inst-side { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
  .inst-side .logo { display: none; }
  .step { white-space: nowrap; padding: 6px 10px; font-size: 12.5px; }
  .inst-content { padding: 18px 16px; }
  .files { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .places { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .places button { white-space: nowrap; }
  .tray-hide { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div id="screen">
  <canvas id="wallpaper" aria-hidden="true"></canvas>
  <div id="desktop-icons"></div>
  <div id="windows"></div>
  <div id="launcher" hidden>
    <div class="lhead"><div class="avatar" id="l-avatar">M</div><div><b id="l-name">MoonOS Live</b><small id="l-host">liveuser@moonos</small></div></div>
    <input id="lsearch" type="search" placeholder="Buscar aplicaciones…" aria-label="Buscar aplicaciones" autocomplete="off">
    <div id="lapps"></div>
    <div class="lfoot">
      <button id="btn-reboot" type="button"></button>
      <button id="btn-off" type="button"></button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="panel">
    <button class="pbtn" id="launcher-btn" type="button" aria-label="Menú de aplicaciones"></button>
    <div id="tasks"></div>
    <div id="tray">
      <span class="pbtn tray-hide" title="Red: conectado" id="tray-net"></span>
      <span class="pbtn tray-hide" title="Volumen 70%" id="tray-vol"></span>
      <div id="clock"><b id="clock-t">--:--</b><small id="clock-d"></small></div>
    </div>
  </div>

  <div class="overlay" id="grub" hidden>
    <h1 id="grub-title">GNU GRUB</h1>
    <ul id="grub-list"></ul>
    <p id="grub-hint"></p>
  </div>
  <div class="overlay" id="splash" hidden>
    <svg viewBox="0 0 100 100" aria-hidden="true" id="splash-logo"></svg>
    <div class="word">Moon<span>OS</span></div>
    <div class="spinner" role="status" aria-label="Cargando"></div>
  </div>
  <div class="overlay" id="login" hidden>
    <div class="big-avatar" id="login-avatar">M</div>
    <h2 id="login-name"></h2>
    <form id="login-form" autocomplete="off">

<script>

const GLYPH = {

  games: '<path d="M7 8h10a4 4 0 0 1 4 4v1.5a2.5 2.5 0 0 1-4.3 1.7L15.5 14h-7l-1.2 1.2A2.5 2.5 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M8 10v3M6.5 11.5h3M15.5 11h.01M17 12.5h.01"/>',
  files: '<path d="M3 7.5A2 2 0 0 1 5 5.5h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',

  intel: { name: "Intel Arc A750", short: "Intel Arc A750", pci: "0300:8086:56a1", chip: "DG2 [Arc A750]", vendor: "Intel Corporation",

};

/* ================= Wallpaper ================= */
const wp = $("#wallpaper");
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function drawWallpaper() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = wp.clientWidth, H = wp.clientHeight;
  wp.width = W * dpr; wp.height = H * dpr;
  const c = wp.getContext("2d"); c.scale(dpr, dpr);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0920"); g.addColorStop(.7, "#221a52"); g.addColorStop(1, "#3a2a7a");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const r = rng(42);
  for (let i = 0; i < (W * H) / 2600; i++) {
    const x = r() * W, y = r() * H * .8, s = r() ** 3 * 1.8 + .4;
    c.globalAlpha = .4 + r() * .6; c.fillStyle = "#fff";
    c.beginPath(); c.arc(x, y, s, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  // moon
  const mr = Math.min(W, H) * (isPhone() ? .2 : .2);
  const mx = W * (isPhone() ? .68 : .74), my = H * (isPhone() ? .5 : .3);
  const glow = c.createRadialGradient(mx, my, mr * .6, mx, my, mr * 2.2);
  glow.addColorStop(0, "rgba(170,150,255,.35)"); glow.addColorStop(1, "rgba(170,150,255,0)");
  c.fillStyle = glow; c.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  const off = document.createElement("canvas"); off.width = off.height = Math.ceil(mr * 2.4 * dpr);
  const o = off.getContext("2d"); o.scale(dpr, dpr);
  const cx = mr * 1.2;
  o.fillStyle = "#ece6ff"; o.beginPath(); o.arc(cx, cx, mr, 0, 7); o.fill();
  o.globalCompositeOperation = "destination-out";
  o.beginPath(); o.arc(cx + mr * .5, cx - mr * .28, mr * .95, 0, 7); o.fill();
  c.drawImage(off, mx - cx, my - cx, mr * 2.4, mr * 2.4);
  // mountains
  [["#241d58", .8, 90], ["#16123a", .88, 60]].forEach(([col, base, amp], li) => {
    const rr = rng(7 + li * 13); let y = H * base;
    c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 40; x += 36) { c.lineTo(x, y); y = Math.max(H * .62, Math.min(H * .96, y + (rr() - .5) * amp * .7)); }
    c.lineTo(W, H); c.closePath(); c.fill();
  });
}
addEventListener("resize", () => { clearTimeout(drawWallpaper.t); drawWallpaper.t = setTimeout(drawWallpaper, 120); });

/* ================= Toasts ================= */
function toast(title, text, ic = "about", ms = 6000) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `${icon(ic)}<div><b>${esc(title)}</b><p>${esc(text)}</p></div>`;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), ms);
}

/* ================= Window manager ================= */
const APPS = {};
function focusWin(id) {
  const w = S.wins[id]; if (!w) return;
  w.el.classList.remove("min", "inactive");
  w.el.style.zIndex = ++S.z;
  Object.values(S.wins).forEach(o => { if (o !== w) o.el.classList.add("inactive"); });
  renderTasks(id);
}
function closeWin(id) {
  const w = S.wins[id]; if (!w) return;
  w.onClose && w.onClose();
  w.el.remove(); delete S.wins[id];
  const top = Object.keys(S.wins).sort((a, b) => S.wins[b].el.style.zIndex - S.wins[a].el.style.zIndex)[0];
  top ? focusWin(top) : renderTasks();
}
function openApp(id, opts = {}) {
  hideLauncher();
  if (S.wins[id]) { focusWin(id); return S.wins[id]; }
  const app = APPS[id];
  const area = $("#windows").getBoundingClientRect();
  const w = Math.min(app.w, area.width - 20), h = Math.min(app.h, area.height - 20);
  const x = Math.max(10, (area.width - w) / 2 + (S.cascade % 5) * 26 - 52);
  const y = Math.max(8, (area.height - h) / 2 + (S.cascade % 5) * 22 - 44);
  S.cascade++;
  const el = document.createElement("section");
  el.className = "win"; el.setAttribute("aria-label", app.title);
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  el.innerHTML = `<div class="titlebar">${icon(app.icon).replace("<svg", '<svg class="ticon"')}<span class="ttl">${esc(app.title)}</span>
    <button class="wbtn" data-a="min" aria-label="Minimizar">${UI.min}</button>
    <button class="wbtn" data-a="max" aria-label="Maximizar">${UI.max}</button>
    <button class="wbtn close" data-a="close" aria-label="Cerrar">${UI.close}</button></div><div class="wbody"></div>`;
  $("#windows").append(el);
  const win = { id, el, body: $(".wbody", el), app };
  S.wins[id] = win;
  el.addEventListener("pointerdown", () => focusWin(id));
  $(".titlebar", el).addEventListener("click", e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "close") closeWin(id);
    if (a === "min") { el.classList.add("min"); renderTasks(); }
    if (a === "max") el.classList.toggle("max");
  });
  $(".titlebar", el).addEventListener("dblclick", e => { if (!e.target.closest("button")) el.classList.toggle("max"); });
  drag(el);
  app.render(win, opts);
  focusWin(id);
  return win;
}
function drag(el) {
  const bar = $(".titlebar", el);
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || el.classList.contains("max") || isPhone()) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    const area = $("#windows").getBoundingClientRect();
    bar.setPointerCapture(e.pointerId);
    const mv = ev => {
      el.style.left = Math.min(area.width - 80, Math.max(-el.offsetWidth + 80, ox + ev.clientX - sx)) + "px";
      el.style.top = Math.min(area.height - 40, Math.max(0, oy + ev.clientY - sy)) + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); };
    bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up);
  });
}
function renderTasks(active) {
  const top = active || Object.keys(S.wins).find(k => !S.wins[k].el.classList.contains("min") && !S.wins[k].el.classList.contains("inactive"));
  $("#tasks").innerHTML = Object.values(S.wins).map(w =>
    `<button class="pbtn ${w.id === top && !w.el.classList.contains("min") ? "on" : ""}" data-w="${w.id}" title="${esc(w.app.title)}">${icon(w.app.icon)}<span>${esc(w.app.title)}</span></button>`).join("");
}
$("#tasks").addEventListener("click", e => {
  const id = e.target.closest("[data-w]")?.dataset.w; if (!id) return;
  const w = S.wins[id];
  if (!w.el.classList.contains("min") && !w.el.classList.contains("inactive")) { w.el.classList.add("min"); renderTasks(); }
  else focusWin(id);
});

/* ================= Launcher / desktop ================= */
const LIST = () => [

document.addEventListener("click", e => {

const hideLauncher = () => { $("#launcher").hidden = true; };

$("#tray-net").innerHTML = UI.wifi; $("#tray-vol").innerHTML = UI.vol;
function clock() {

/* ================= Boot sequence ================= */
$("#splash-logo").innerHTML = MOON("sp");
async function boot(showMenu) {
  if (showMenu) {
    const entries = S.installed
      ? ["MoonOS", "Opciones avanzadas para MoonOS", "Ajustes del firmware UEFI"]
      : ["MoonOS Live (x86_64, UEFI)", "MoonOS Live con lector de pantalla", "Memtest86+"];
    const g = $("#grub"); g.hidden = false;
    $("#grub-title").textContent = S.installed ? "GNU GRUB" : "MoonOS · menú de arranque";
    $("#grub-list").innerHTML = entries.map((t, i) => `<li class="${i ? "" : "sel"}" data-i="${i}">${esc(t)}</li>`).join("");
    let n = 3;
    await new Promise(res => {
      const tick = () => { $("#grub-hint").textContent = `Se iniciará la opción resaltada en ${n} s. Pulsa una opción para arrancar ya.`; };
      tick();
      const iv = setInterval(() => { n--; tick(); if (n <= 0) done(); }, 1000);
      const done = () => { clearInterval(iv); g.removeEventListener("click", onc); document.removeEventListener("keydown", onk); res(); };
      const onc = e => { if (e.target.closest("li")) done(); };
      const onk = e => { if (e.key === "Enter") done(); };
      g.addEventListener("click", onc); document.addEventListener("keydown", onk);
    });
    g.hidden = true;
  }
  $("#splash").hidden = false;
  await sleep(reduced ? 300 : 1500);
  renderDesktop();
  $("#splash").hidden = true;
  if (S.installed) {
    $("#login-name").textContent = S.user.name;
    $("#login-avatar").textContent = S.user.name.trim()[0]?.toUpperCase() || "M";
    $("#login-err").textContent = ""; $("#login-pass").value = "";

    toast("Bienvenido a MoonOS Live", "Esto es una demo en el navegador: nada se instala de verdad. Prueba la Terminal, los Juegos o el instalador.", "about", 9000);
  }
}
$("#login-form").addEventListener("submit", e => {

  setTimeout(() => toast("¡Hola, " + S.user.name.split(" ")[0] + "!", "MoonOS ya está instalado. Tu escritorio está listo.", "about"), 1400);
});

/* ================= App: Terminal ================= */
const FASTFETCH = () => {
  const g = GPUS[S.gpu], u = S.user;
  const art = [
    "        .-''''-.      ", "      .'  .--.  '.    ", "     /   /    '. \\   ", "    |   |       \\ |  ",
    "    |   |        )|  ", "     \\   \\      / /  ", "      '.  '----' .'   ", "        '-......-'    ",
  ];
  const info = [
    `<span class="c-acc c-b">${esc(u.login)}</span>@<span class="c-acc c-b">${esc(u.host)}</span>`,
    "-".repeat(u.login.length + u.host.length + 1),
    `<span class="c-acc c-b">SO</span>: MoonOS x86_64`,
    `<span class="c-acc c-b">Kernel</span>: 6.17.9-2-cachyos`,
    `<span class="c-acc c-b">Paquetes</span>: 1384 (pacman), 6 (flatpak)`,

  ];
  return art.map((a, i) => `<span class="c-acc">${esc(a)}</span>${info[i] || ""}`).join("\n") +
    "\n" + " ".repeat(22) + ["#ff8094", "#ffcf6e", "#6ee7a8", "#5fb3ff", "#a996ff", "#ff7ab6"].map(c => `<span style="color:${c}">███</span>`).join("");

APPS.terminal = {
  title: "Terminal", icon: "terminal", w: 720, h: 440,
  render(win) {
    win.body.innerHTML = `<div class="term"><pre class="out"></pre><div class="line"><pre class="ps"></pre><input aria-label="Comando" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>`;
    const out = $(".out", win.body), inp = $("input", win.body), ps = $(".ps", win.body), term = $(".term", win.body);
    const prompt = () => `<span class="c-good c-b">${esc(S.user.login)}@${esc(S.user.host)}</span> <span class="c-acc c-b">~</span> $ `;
    ps.innerHTML = prompt();
    const hist = []; let hi = 0, busy = false;
    const print = html => { out.innerHTML += html + "\n"; win.body.scrollTop = win.body.scrollHeight; };
    print(`Bienvenido a la terminal de MoonOS. Escribe <span class="c-acc">help</span> para ver los comandos.\n`);
    term.addEventListener("click", () => { if (!getSelection().toString()) inp.focus(); });
    if (!isPhone()) setTimeout(() => inp.focus(), 50);
    const slow = async lines => { for (const [l, ms] of lines) { print(l); await sleep(reduced ? 0 : ms); } };
    const CMDS = {
      help: () => print([
        "Comandos disponibles:",
        "  <span class=\"c-acc\">fastfetch</span>          información del sistema",
        "  <span class=\"c-acc\">sudo pacman -Syu</span>   actualizar el sistema",
        "  <span class=\"c-acc\">sudo chwd -a</span>       detectar e instalar drivers",
        "  <span class=\"c-acc\">lspci</span>              ver la tarjeta gráfica",
        "  <span class=\"c-acc\">gamemoded -s</span>       estado de GameMode",
        "  <span class=\"c-acc\">cat /etc/os-release</span>",
        "  <span class=\"c-acc\">uname -a</span>, <span class=\"c-acc\">whoami</span>, <span class=\"c-acc\">date</span>, <span class=\"c-acc\">ls</span>, <span class=\"c-acc\">echo</span>, <span class=\"c-acc\">clear</span>, <span class=\"c-acc\">exit</span>",
      ].join("\n")),
      fastfetch: () => print(FASTFETCH()), neofetch: () => print(FASTFETCH()),
      uname: a => print(a.includes("-a") ? `Linux ${esc(S.user.host)} 6.17.9-2-cachyos #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux` : "Linux"),
      whoami: () => print(esc(S.user.login)),
      hostname: () => print(esc(S.user.host)),
      date: () => print(new Date().toLocaleString("es")),
      pwd: () => print(`/home/${esc(S.user.login)}`),
      ls: () => print('<span class="c-acc c-b">Descargas  Documentos  Escritorio  Imágenes  Juegos  Música  Vídeos</span>'),
      echo: a => print(esc(a.join(" "))),
      clear: () => { out.innerHTML = ""; },
      exit: () => closeWin("terminal"),
      lspci: () => print(`00:00.0 Host bridge: Advanced Micro Devices, Inc. Raphael Root Complex\n01:00.0 VGA compatible controller: ${esc(GPUS[S.gpu].vendor)} ${esc(GPUS[S.gpu].chip)}\n02:00.0 Network controller: Intel Corporation Wi-Fi 6 AX200\n03:00.0 Audio device: ${esc(GPUS[S.gpu].vendor)} HD Audio Controller`),
      "gamemoded": a => print(a.includes("-s") ? (S.fx.gamemode ? "gamemode is <span class=\"c-good\">active</span>" : "gamemode is <span class=\"c-mut\">inactive</span>") : "uso: gamemoded -s"),
      cat: a => {
        if (a[0] === "/etc/os-release" || a[0] === "/usr/lib/os-release") print('NAME="MoonOS"\nPRETTY_NAME="MoonOS"\nID=moonos\nID_LIKE="cachyos arch"\nBUILD_ID=rolling\nLOGO=moonos');
        else print(`cat: ${esc(a[0] || "")}: No existe el archivo o el directorio`);
      },
      pacman: async (a, sudo) => {
        if (!a.join(" ").includes("-Syu")) return print("Prueba: sudo pacman -Syu");
        if (!sudo) return print('<span class="c-bad">error:</span> debes ser root para realizar esta operación. Usa <span class="c-acc">sudo</span>.');
        await slow([
          ['<span class="c-acc c-b">::</span> <span class="c-b">Sincronizando las bases de datos de paquetes...</span>', 300],
          [" cachyos              180,2 KiB  1203 KiB/s 00:00 [######################] 100%", 250],
          [" core                 117,4 KiB   980 KiB/s 00:00 [######################] 100%", 250],
          [" extra                  8,1 MiB  12,4 MiB/s 00:01 [######################] 100%", 450],
          [" multilib             131,9 KiB  1,1 MiB/s 00:00 [######################] 100%", 250],
          ['<span class="c-acc c-b">::</span> <span class="c-b">Iniciando actualización completa del sistema...</span>', 500],
          [" no hay nada que hacer", 0],
        ]);
      },
      chwd: async (a, sudo) => {
        if (!a.includes("-a")) return print("uso: chwd -a   (configura los drivers automáticamente)");
        if (!sudo) return print('<span class="c-bad">error:</span> chwd necesita permisos de root. Usa <span class="c-acc">sudo chwd -a</span>.');
        const g = GPUS[S.gpu];
        await slow([
          ["> Buscando dispositivos PCI...", 400],
          [`  ${g.pci}  ${esc(g.vendor)} ${esc(g.chip)}`, 400],
          [`> Perfil elegido: <span class="c-acc">${esc(g.profile)}</span>`, 400],
          ...g.keep.map(p => [`  instalado  ${esc(p)}`, 120]),
          [`<span class="c-good">> Listo: drivers de ${esc(g.name)} configurados.</span>`, 0],
        ]);
        S.driversDone = true;
      },
    };
    inp.addEventListener("keydown", async e => {
      if (e.key === "ArrowUp") { if (hi > 0) inp.value = hist[--hi]; e.preventDefault(); return; }
      if (e.key === "ArrowDown") { inp.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ""); return; }
      if (e.key !== "Enter" || busy) return;
      const raw = inp.value; inp.value = "";
      print(prompt() + esc(raw));
      if (!raw.trim()) return;
      hist.push(raw); hi = hist.length;
      let parts = raw.trim().split(/\s+/), sudo = false;
      if (parts[0] === "sudo") { sudo = true; parts = parts.slice(1); if (!parts.length) return print("uso: sudo &lt;comando&gt;"); }
      const fn = CMDS[parts[0]];
      if (!fn) return print(`bash: ${esc(parts[0])}: orden no encontrada. Escribe <span class="c-acc">help</span>.`);
      busy = true; ps.style.visibility = "hidden";
      await fn(parts.slice(1), sudo);
      busy = false; ps.style.visibility = ""; ps.innerHTML = prompt();
      win.body.scrollTop = win.body.scrollHeight;
    });
  },
};

function cover(title, c1, c2, kind) {
  const cv = document.createElement("canvas"); cv.width = 300; cv.height = 400;
  const c = cv.getContext("2d"); const g = c.createLinearGradient(0, 0, 0, 400);
  g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillRect(0, 0, 300, 400);
  const r = rng(title.length * 97);
  c.fillStyle = "rgba(255,255,255,.8)";
  for (let i = 0; i < 60; i++) { c.globalAlpha = r(); c.fillRect(r() * 300, r() * 260, 2, 2); }
  c.globalAlpha = 1;
  if (kind === "moon") { c.fillStyle = "#ece6ff"; c.beginPath(); c.arc(210, 110, 50, 0, 7); c.fill(); c.fillStyle = c1; c.beginPath(); c.arc(235, 95, 46, 0, 7); c.fill();
    c.fillStyle = "#ffcf6e"; c.beginPath(); c.moveTo(150, 250); c.lineTo(125, 300); c.lineTo(175, 300); c.fill(); }
  if (kind === "road") { c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.moveTo(130, 220); c.lineTo(170, 220); c.lineTo(300, 400); c.lineTo(0, 400); c.fill();
    c.strokeStyle = "#ffcf6e"; c.lineWidth = 4; c.setLineDash([18, 14]); c.beginPath(); c.moveTo(150, 225); c.lineTo(150, 400); c.stroke(); c.setLineDash([]); }
  if (kind === "cube") { c.fillStyle = "rgba(255,255,255,.18)"; for (let i = 0; i < 6; i++) c.fillRect(40 + i * 38, 300 - i * 30, 34, 34 + i * 30); }
  if (kind === "forest") { c.fillStyle = "rgba(0,0,0,.4)"; for (let i = 0; i < 9; i++) { const x = i * 36 + 5, h = 120 + r() * 90; c.beginPath(); c.moveTo(x, 400); c.lineTo(x + 18, 400 - h); c.lineTo(x + 36, 400); c.fill(); } }
  c.fillStyle = "rgba(0,0,0,.45)"; c.fillRect(0, 320, 300, 80);
  c.fillStyle = "#fff"; c.font = "700 28px 'Noto Sans', sans-serif"; c.fillText(title, 18, 368);
  return cv.toDataURL("image/png");
}

/* Mini-game: Polvo Lunar */
APPS.moondust = {
  title: "Polvo Lunar", icon: "game", w: 760, h: 520,
  render(win) {
    win.body.style.overflow = "hidden";
    win.body.innerHTML = `<div class="gamewrap" tabindex="0" aria-label="Juego Polvo Lunar. Usa las flechas o toca los lados de la pantalla."><canvas></canvas></div>`;
    const wrap = $(".gamewrap", win.body), cv = $("canvas", wrap), c = cv.getContext("2d");
    let W = 0, H = 0, dpr = 1, raf = 0, last = 0, fps = 60, ft = 16.7;
    const G = { x: .5, dir: 0, keys: new Set(), items: [], score: 0, lives: 3, t: 0, spawn: 0, over: false, started: false, best: 0 };
    const resize = () => { const r = wrap.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; };
    const ro = new ResizeObserver(resize); ro.observe(wrap); resize();
    const bgStars = Array.from({ length: 90 }, (_, i) => [rng(i + 3)(), rng(i + 99)(), rng(i + 7)() * 1.5 + .3]);
    const reset = () => Object.assign(G, { x: .5, items: [], score: 0, lives: 3, t: 0, spawn: 0, over: false, started: true });
    const kd = e => {
      if (!S.wins.moondust || S.wins.moondust.el.classList.contains("inactive")) return;
      if (["ArrowLeft", "ArrowRight", "a", "d", "A", "D"].includes(e.key)) { G.keys.add(e.key.toLowerCase()); e.preventDefault(); }
      if ((e.key === " " || e.key === "Enter") && (!G.started || G.over)) { reset(); e.preventDefault(); }
    };
    const ku = e => G.keys.delete(e.key.toLowerCase());
    addEventListener("keydown", kd); addEventListener("keyup", ku);
    wrap.addEventListener("pointerdown", e => {
      if (!G.started || G.over) { reset(); return; }
      const r = wrap.getBoundingClientRect(); G.dir = e.clientX - r.left < r.width / 2 ? -1 : 1; wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener("pointermove", e => { if (e.buttons) { const r = wrap.getBoundingClientRect(); G.dir = e.clientX - r.left < r.width / 2 ? -1 : 1; } });
    const stop = () => { G.dir = 0; }; wrap.addEventListener("pointerup", stop); wrap.addEventListener("pointercancel", stop);
    const view = () => {
      if (!S.fx.gamescope) return { x: 0, y: 0, w: W, h: H };
      const s = Math.min(W / 16, H / 9); return { x: (W - s * 16) / 2, y: (H - s * 9) / 2, w: s * 16, h: s * 9 };
    };
    const frame = now => {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
      if (dt > 0) { ft = ft * .9 + dt * 1000 * .1; fps = 1000 / ft; }
      const v = view();
      c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
      c.save(); c.beginPath(); c.rect(v.x, v.y, v.w, v.h); c.clip(); c.translate(v.x, v.y);
      const g = c.createLinearGradient(0, 0, 0, v.h); g.addColorStop(0, "#07061a"); g.addColorStop(1, "#231a55");
      c.fillStyle = g; c.fillRect(0, 0, v.w, v.h);
      G.t += dt;
      bgStars.forEach(s => { c.globalAlpha = .6; c.fillStyle = "#fff"; c.fillRect(s[0] * v.w, ((s[1] * v.h + G.t * 20 * s[2]) % v.h), s[2], s[2]); });
      c.globalAlpha = 1;
      const shipY = v.h - 46, sz = Math.max(14, v.w * .022);
      if (G.started && !G.over) {
        const left = G.keys.has("arrowleft") || G.keys.has("a") || G.dir < 0, right = G.keys.has("arrowright") || G.keys.has("d") || G.dir > 0;
        G.x = Math.max(.04, Math.min(.96, G.x + ((right ? 1 : 0) - (left ? 1 : 0)) * dt * .75));
        const speed = 1 + G.t / 25 * (S.fx.gamemode ? 1 : 1.15);
        G.spawn -= dt;
        if (G.spawn <= 0) { G.spawn = Math.max(.25, .8 - G.t / 60); G.items.push({ x: Math.random() * .92 + .04, y: -20, star: Math.random() < .45, r: 8 + Math.random() * 10, s: (120 + Math.random() * 90) * speed }); }
        G.items.forEach(it => { it.y += it.s * dt; });
        G.items = G.items.filter(it => {
          const dx = it.x * v.w - G.x * v.w, dy = it.y - shipY;
          if (Math.hypot(dx, dy) < it.r + sz * .7) { if (it.star) G.score += 10; else { G.lives--; if (G.lives <= 0) { G.over = true; G.best = Math.max(G.best, G.score); } } return false; }
          return it.y < v.h + 30;
        });
        G.score += dt * 2;
      }
      G.items.forEach(it => {
        const x = it.x * v.w;
        if (it.star) { c.fillStyle = "#ffcf6e"; c.beginPath(); for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? it.r * .45 : it.r; c.lineTo(x + Math.cos(a) * rr, it.y + Math.sin(a) * rr); } c.fill(); }
        else { c.fillStyle = "#7c6a9e"; c.beginPath(); c.arc(x, it.y, it.r, 0, 7); c.fill(); c.fillStyle = "#5b4c78"; c.beginPath(); c.arc(x - it.r * .3, it.y - it.r * .2, it.r * .3, 0, 7); c.fill(); }
      });
      const sx = G.x * v.w;
      c.fillStyle = "#ece6ff"; c.beginPath(); c.moveTo(sx, shipY - sz); c.lineTo(sx - sz * .8, shipY + sz * .7); c.lineTo(sx + sz * .8, shipY + sz * .7); c.fill();
      if (G.started && !G.over) { c.fillStyle = "#a996ff"; c.beginPath(); c.moveTo(sx - sz * .35, shipY + sz * .7); c.lineTo(sx, shipY + sz * (1.2 + Math.random() * .4)); c.lineTo(sx + sz * .35, shipY + sz * .7); c.fill(); }
      c.fillStyle = "#fff"; c.font = "600 16px 'Noto Sans', sans-serif"; c.textAlign = "right";
      c.fillText(`Puntos ${Math.floor(G.score)}   ${"♥".repeat(Math.max(0, G.lives))}`, v.w - 14, 26);
      c.textAlign = "center";
      if (!G.started || G.over) {
        c.fillStyle = "rgba(7,6,26,.7)"; c.fillRect(0, 0, v.w, v.h); c.fillStyle = "#fff";
        c.font = "700 30px 'Noto Sans', sans-serif"; c.fillText(G.over ? "Fin del juego" : "Polvo Lunar", v.w / 2, v.h / 2 - 30);
        c.font = "15px 'Noto Sans', sans-serif"; c.fillStyle = "#c8c2e8";
        c.fillText(G.over ? `Puntos: ${Math.floor(G.score)} · Récord: ${Math.floor(G.best)}` : "Atrapa estrellas y esquiva meteoritos", v.w / 2, v.h / 2 + 2);
        c.fillText(isPhone() || matchMedia("(pointer: coarse)").matches ? "Toca para jugar · toca los lados para moverte" : "Pulsa Espacio o haz clic para jugar · flechas para moverte", v.w / 2, v.h / 2 + 28);
      }
      c.restore();
      if (S.fx.gamescope) { c.fillStyle = "#77739a"; c.font = "11px 'JetBrains Mono', monospace"; c.textAlign = "right"; c.fillText("gamescope · 1280×720 → escalado", W - 8, H - 8); }
      if (S.fx.mangohud) {
        c.textAlign = "left"; c.fillStyle = "rgba(0,0,0,.55)"; c.fillRect(v.x + 8, v.y + 8, 172, 92);
        c.font = "12px 'JetBrains Mono', monospace";
        const rows = [["GPU", "#6ee7a8", `${S.fx.gamemode ? 61 : 54}%  ${GPUS[S.gpu].short.split(" ")[0]}`], ["CPU", "#5fb3ff", `${S.fx.gamemode ? 23 : 31}%  4.9GHz`], ["FPS", "#ffcf6e", `${Math.round(fps)}`], ["ms", "#c8c2e8", ft.toFixed(1)], ["GM", "#ff7ab6", S.fx.gamemode ? "activo" : "inactivo"]];
        rows.forEach(([k, col, val], i) => { c.fillStyle = col; c.fillText(k, v.x + 16, v.y + 26 + i * 16); c.fillStyle = "#fff"; c.fillText(val, v.x + 56, v.y + 26 + i * 16); });
      }
    };
    raf = requestAnimationFrame(frame);
    win.onClose = () => { cancelAnimationFrame(raf); ro.disconnect(); removeEventListener("keydown", kd); removeEventListener("keyup", ku); };
    wrap.focus();
  },
};
