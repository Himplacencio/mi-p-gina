<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#0c0a22;color:#eeeaff;font-family:Manrope,sans-serif;overflow:hidden}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 32%,rgba(124,99,255,.45),transparent 70%),linear-gradient(180deg,#0a0920,#2a1f66)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.moon{position:absolute;left:50%;top:150px;width:250px;height:250px;margin-left:-125px;border-radius:50%;
 background:radial-gradient(circle at 36% 40%,#fffaf0,#f4ecd0 45%,#d9ccff);
 -webkit-mask:radial-gradient(circle at 78% 26%,transparent 47%,#000 47.6%);
 animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.glow{position:absolute;left:50%;top:75px;width:400px;height:400px;margin-left:-200px;border-radius:50%;background:radial-gradient(circle,rgba(244,236,208,.35),transparent 65%);animation:pulse 2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(120px) scale(.8);opacity:0}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.t{position:absolute;left:0;right:0;text-align:center;padding:0 24px}
.name{top:425px;font-family:Unbounded,sans-serif;font-weight:700;font-size:56px;letter-spacing:-.01em;animation:up .6s .5s both}
.name span{color:#a996ff}
.when{top:505px;animation:up .6s 1s both}
.when b{display:inline-block;font-family:Unbounded,sans-serif;font-size:26px;white-space:nowrap;color:#1b1406;background:#f4ecd0;padding:10px 22px;border-radius:16px;box-shadow:0 0 50px rgba(244,236,208,.5)}
.sub{top:582px;font-size:21px;font-weight:700;color:#cfc8f2;line-height:1.4;animation:up .6s 1.6s both}
.follow{top:668px;font-size:19px;font-weight:700;color:#a996ff;animation:up .6s 2.2s both}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.ridge{position:absolute;left:0;right:0;bottom:0;height:120px}
</style></head><body>
<div class="sky"></div><canvas id="c"></canvas>
<div class="glow"></div><div class="moon"></div>
<div class="t name">Moon<span>OS</span></div>
<div class="t when"><b>Disponible en 2027 🌙</b></div>
<div class="t sub">Lo estamos terminando paso a paso…<br>y tú puedes verlo nacer 👀</div>
<div class="t follow">Síguenos para no perdértelo ✨</div>
<svg class="ridge" viewBox="0 0 432 120" preserveAspectRatio="none"><path d="M0 120 L0 70 L30 55 L60 72 L95 40 L130 66 L170 50 L205 74 L245 45 L280 62 L320 38 L360 64 L400 50 L432 60 L432 120Z" fill="#160f3d"/><path d="M0 120 L0 92 L40 84 L80 98 L120 80 L170 96 L220 86 L270 100 L320 82 L370 96 L432 86 L432 120Z" fill="#0c0a22"/></svg>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth*2;c.height=innerHeight*2;x.scale(2,2);
const st=Array.from({length:120},(_,i)=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.8,r:Math.random()**3*1.6+.4,p:Math.random()*6}));
(function f(t){x.clearRect(0,0,innerWidth,innerHeight);st.forEach(s=>{x.globalAlpha=.35+.65*Math.abs(Math.sin(t/700+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(f)})(0);
</script>
</body></html>
