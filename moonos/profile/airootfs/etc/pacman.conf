[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repositorio de CachyOS (kernel optimizado, chwd, ajustes de rendimiento)
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Bibliotecas de 32 bits (necesarias para Steam y Wine)
[multilib]
Include = /etc/pacman.d/mirrorlist
