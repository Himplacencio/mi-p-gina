---
# Copia el sistema Live (ya con KDE, juegos y drivers) al disco.
unpack:
    - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
    # archiso guarda el kernel fuera del sistema de archivos comprimido
    - source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-cachyos"
      sourcefs: "file"
      destination: "/boot/vmlinuz-linux-cachyos"
