---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - audio
    - video
    - storage
    - optical
    - input
    - lp
    - wheel
    - name: autologin
      must_exist: false
      system: true
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: false
doReusePassword: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    nonempty: true
userShell: /bin/bash
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "moonos-${cpu}"
