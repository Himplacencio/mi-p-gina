# Configuración principal del instalador de MoonOS (Calamares)
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       moonos_prep
  module:   shellprocess
  config:   shellprocess_moonos_prep.conf
- id:       moonos
  module:   shellprocess
  config:   shellprocess_moonos.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@moonos_prep
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@moonos
  - services-systemd
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: moonos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
